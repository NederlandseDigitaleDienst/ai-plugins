# Machine-leesbare metadata volgens de publiccode.yml-standaard, voor de
# open-sourcecatalogus op developer.overheid.nl.

publiccodeYmlVersion: "0.7"

name: NLDD plugins voor AI-assistenten
url: "https://github.com/NederlandseDigitaleDienst/ai-plugins"

softwareType: standalone/other
developmentStatus: beta

platforms:
  - linux
  - mac
  - windows

categories:
  - it-development

description:
  nl:
    shortDescription: >-
      Marketplace van de Nederlandse Digitale Dienst met plugins voor
      AI-assistenten zoals Claude Code en Cursor.
    longDescription: >-
      Deze repository is de marketplace van de Nederlandse Digitale Dienst:
      een lijst van plugins die een AI-assistent leren werken met wat NLDD
      maakt. De plugins zelf staan elk in hun eigen repository, hier staat
      alleen de lijst met een verwijzing naar elke plugin. De eerste plugin is
      die van het NLDD Designsysteem, met de componentreferentie, de patronen
      en de werkwijze voor migreren en upgraden.

      De lijst staat in een formaat dat aan geen tool vastzit. Een script
      maakt daaruit de bestanden die Claude Code en Cursor verwachten, en een
      controle bij elke wijziging bewaakt dat die bestanden bij de bron
      passen. Een tool erbij is een functie in dat script. De opzet komt uit
      de marketplace van developer.overheid.nl.
    features:
      - Plugins voor Claude Code en Cursor uit één bronbestand
      - Plugin voor het NLDD Designsysteem
      - Geautomatiseerde validatie van de lijst

